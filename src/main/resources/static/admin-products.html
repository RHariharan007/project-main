<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage products — Shopcraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main class="container">
  <div class="admin-toolbar">
    <div>
      <h1 class="page-title" style="padding:0;">Products</h1>
      <p class="muted">Add, edit or remove items from your catalog.</p>
    </div>
    <button class="btn btn-primary" id="add-product-btn">+ Add product</button>
  </div>

  <div id="alert-box" class="alert alert-error"></div>

  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="products-tbody">
        <tr><td colspan="5" class="muted">Loading products...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Add / edit product modal -->
<div class="modal-overlay" id="product-modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modal-title">Add product</h3>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <div id="modal-alert" class="alert alert-error"></div>
    <form id="product-form">
      <input type="hidden" id="product-id">
      <div class="field">
        <label for="name">Product name</label>
        <input type="text" id="name" required>
      </div>
      <div class="field">
        <label for="description">Description</label>
        <textarea id="description" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="price">Price (₹)</label>
        <input type="number" id="price" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="stock">Stock quantity</label>
        <input type="number" id="stock" min="0" required>
      </div>
      <div class="field">
        <label for="imageUrl">Image URL (optional)</label>
        <input type="text" id="imageUrl" placeholder="https://...">
      </div>
      <div class="field">
        <label for="categoryId">Category</label>
        <select id="categoryId"></select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="save-product-btn">Save product</button>
    </form>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/admin-products.js"></script>
</body>
</html>
