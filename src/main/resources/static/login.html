<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Shopcraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card card">
      <a href="products.html" class="brand" style="display:block;margin-bottom:28px;">Shopcraft</a>
      <h1>Welcome back</h1>
      <p class="muted mb-24">Log in to continue shopping or manage your store.</p>

      <div id="alert-box" class="alert alert-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
      </form>

      <p class="text-center muted mt-24">
        New here? <a href="register.html" style="color:var(--indigo);font-weight:600;">Create an account</a>
      </p>

      <p class="text-center muted" style="font-size:0.8rem;margin-top:32px;">
        Demo admin login — admin@shop.com / Admin@123
      </p>
    </div>
  </div>

<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
