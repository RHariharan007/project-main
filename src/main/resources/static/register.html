<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — Shopcraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card card">
      <a href="products.html" class="brand" style="display:block;margin-bottom:28px;">Shopcraft</a>
      <h1>Create your account</h1>
      <p class="muted mb-24">Sign up to start shopping.</p>

      <div id="alert-box" class="alert alert-error"></div>

      <form id="register-form">
        <div class="field">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input type="text" id="phone" name="phone" placeholder="+91 98765 43210">
        </div>
        <div class="field">
          <label for="address">Address (optional)</label>
          <input type="text" id="address" name="address" placeholder="Street, City, PIN">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create account</button>
      </form>

      <p class="text-center muted mt-24">
        Already have an account? <a href="login.html" style="color:var(--indigo);font-weight:600;">Log in</a>
      </p>
    </div>
  </div>

<script src="common.js"></script>
<script src="register.js"></script>
</body>
</html>
